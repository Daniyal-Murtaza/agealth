[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunday"
version = "0.1.0"
description = "Sunday: a daily phone call for your parent, with a short note to the family afterwards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniyal Murtaza" }]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "websockets==17.3",
    "httpx==0.28.1",
    "openai==3.38.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "rich==15.0.0",
    "sqlalchemy==2.1.6",
    "twilio==9.12.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "phonenumbers==9.0.19",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.1", "ruff==0.17.2"]

[project.scripts]
sunday = "sunday.cli:main"

[tool.setuptools.packages.find]
include = ["sunday*"]

[tool.setuptools.package-data]
sunday = ["web/templates/*.html", "web/templates/legal/*.html", "web/static/*", "web/static/fonts/*", "web/static/img/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
